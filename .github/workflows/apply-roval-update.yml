name: Apply Roval update

on:
  push:
    branches: [roval-deploy]
    paths: [.roval-update-ready]

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roval-deploy
          fetch-depth: 0
      - name: Verify and apply exact Roval update
        shell: bash
        run: |
          set -euo pipefail
          cat .roval-exact.part* > /tmp/roval-exact.tgz.b64
          base64 -d /tmp/roval-exact.tgz.b64 > /tmp/roval-exact.tgz
          echo "198034049807cc4adaf9473d3e8096b350eec26fa8efe4ed845bf814ee6e6eb4  /tmp/roval-exact.tgz" | sha256sum -c -
          tar -xzf /tmp/roval-exact.tgz -C .
          rm -f .roval-exact.part* .roval-core.part* .roval-patch.part* .roval-update.patch.gz.b64 .roval-update-ready .test-create .github/workflows/apply-roval-update.yml
      - name: Commit verified Roval update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply verified Roval planner and Cloudflare update"
          git push origin HEAD:roval-deploy
