name: Apply Roval update

on:
  push:
    branches: [roval-deploy]
    paths: [.roval-update-ready]

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roval-deploy
          fetch-depth: 0
      - name: Apply compressed update patch
        shell: bash
        run: |
          set -euo pipefail
          cat .roval-patch.part* > /tmp/roval.patch.gz.b64
          base64 -d /tmp/roval.patch.gz.b64 | gzip -d > /tmp/roval.patch
          patch -p1 < /tmp/roval.patch
          rm -f .roval-patch.part* .roval-update.patch.gz.b64 .roval-update-ready .github/workflows/apply-roval-update.yml
      - name: Commit applied update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Roval planner and Cloudflare deployment update"
          git push origin HEAD:roval-deploy
