name: Apply exact Roval update

on:
  push:
    branches: [roval-deploy]
    paths: [.roval-exact-ready]

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roval-deploy
          fetch-depth: 0

      - name: Reconstruct and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .roval-exact.part00 \
            .roval-exact.part01 \
            .roval-exact.part02 \
            .roval-exact.part03 \
            .roval-exact.part04 \
            .roval-exact.part05 \
            .roval-exact.part06 \
            .roval-exact.part07 \
            .roval-exact.part08 \
            > /tmp/roval-exact.tgz.b64
          base64 -d /tmp/roval-exact.tgz.b64 > /tmp/roval-exact.tgz
          echo "198034049807cc4adaf9473d3e8096b350eec26fa8efe4ed845bf814ee6e6eb4  /tmp/roval-exact.tgz" | sha256sum -c -
          tar -xzf /tmp/roval-exact.tgz -C .

      - name: Verify deployed source files
        shell: bash
        run: |
          set -euo pipefail
          cat <<'SUMS' | sha256sum -c -
          d68ea17ce455e5996fc288ebaf427e7f97c875997b18d14f69afe3e8af127e13  CLOUDFLARE_DEPLOY.md
          89eaea340c245aa2277009a6a0c1ba68522869ce05105f30690552ad777be461  DEPLOYMENT_GUIDE.md
          ddfb4be21fb1631f459585758f53cbfc35fd9af0498f0f2230d42721063234c3  GITHUB_SETUP.md
          d901b4320e38bc884287851d345dfd07d5abfccf8a57d467c69eb98dcb35ea38  HUAWEI_SETUP.md
          58b978c47fb60aa4fab53de99ee1122d2155c8da1b1fb70a698d90076d16dfc3  README.md
          7b338b644a8aacec67862ea2577840ff90baa9632bb8b127b351f411d1c0c406  app/api/sync/route.ts
          3d4a2ae9fc5a4a0ac89dbe766d36dd84c22efbcf6d2fe8c7c618cf84054352de  app/chatgpt-auth.ts
          9a15f027704b36c255b60a6a1b9be6d7959dfda1e962cad6fc674556d154c73d  app/globals.css
          821b2bdc8fe3abb3ecc33c6135da4f41e9dc295482425327f5043a43ebf0f1e5  app/page.tsx
          6e0080e1f29b1821ab7d81c1b97d888e0875b340b4fc2fdc13edc50fba375b7a  package.json
          75f63ea259939955fa1311f1ba66b4740259330334ba013bf08e699cb9f028ec  public/sw.js
          SUMS

      - name: Remove one-time transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .roval-exact.part* \
            .roval-core.part* \
            .roval-patch.part* \
            .roval-update.patch.gz.b64 \
            .roval-update-ready \
            .roval-exact-ready \
            .test-create \
            .github/workflows/apply-roval-update.yml

      - name: Commit verified Roval update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Roval planner and Cloudflare deployment update"
          git push origin HEAD:roval-deploy
